[project]
name = "demos-mb-kafka"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "confluent-kafka",
]

[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "pytest",
    "ruff",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.mypy]
mypy_path = "src:python:scripts"
explicit_package_bases = true
namespace_packages = true

# Third-party libraries without type stubs; `foo.*` also matches `foo` itself.
[[tool.mypy.overrides]]
module = [
    "confluent_kafka.*",
]
ignore_missing_imports = true
